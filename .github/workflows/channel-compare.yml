name: Channel comparison (kanal vs crossbeam, flume, tokio, async-channel)

on:
  push:
    branches: [bench/channel-compare]
  workflow_dispatch:

jobs:
  bench:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        working-directory: channel-compare
        run: cargo build --release
      - name: Run
        working-directory: channel-compare
        shell: bash
        run: |
          cargo run --release -q > results-${{ matrix.os }}.md
          cat results-${{ matrix.os }}.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}
          path: channel-compare/results-${{ matrix.os }}.md
