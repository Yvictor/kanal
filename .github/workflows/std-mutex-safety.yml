name: std-mutex safety (tests + Miri, Linux/macOS/Windows)

# kanal's whole test suite and the Miri race tests for both mutexes on all
# three OSes (test-matrix.yml runs Miri on Linux only).

on:
  push:
    branches: [bench/channel-compare]
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - ".github/workflows/std-mutex-safety.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test ${{ matrix.os }} ${{ matrix.mutex }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        mutex: [spin, std-mutex]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test (debug)
        shell: bash
        run: cargo test ${{ matrix.mutex == 'std-mutex' && '--features std-mutex' || '' }}
      - name: Test (release, 3 rounds incl. stress)
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "::group::round $i"
            cargo test --release ${{ matrix.mutex == 'std-mutex' && '--features std-mutex' || '' }} || exit 1
            echo "::endgroup::"
          done
      - name: Test (sync only)
        shell: bash
        run: cargo test --no-default-features ${{ matrix.mutex == 'std-mutex' && '--features std-mutex' || '' }} --lib --test sync_test --test timeout_stress --test poison_behavior

  miri:
    name: miri ${{ matrix.os }} ${{ matrix.mutex }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        mutex: [spin, std-mutex]
    env:
      MIRIFLAGS: -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Miri (timeout race tests, async)
        shell: bash
        run: cargo miri test ${{ matrix.mutex == 'std-mutex' && '--features std-mutex' || '' }} --lib timeout_race
      - name: Miri (timeout race tests, sync only)
        shell: bash
        run: cargo miri test --no-default-features ${{ matrix.mutex == 'std-mutex' && '--features std-mutex' || '' }} --lib timeout_race
