[package]
name = "kanal"
version = "0.1.3"
edition = "2021"
authors = ["Khashayar Fereidani"]
description = "The fast sync and async channel that Rust deserves"
repository = "https://github.com/fereidani/kanal"
documentation = "https://docs.rs/kanal"
keywords = ["channel", "mpsc", "mpmc", "async"]
categories = ["concurrency", "data-structures", "asynchronous"]
license = "MIT"
readme = "README.md"

[dependencies]
cacheguard = "0.1"
futures-core = { version = "0.3", optional = true }
lock_api = "0.4"
parking_lot = { version = "0.12", optional = true }

[dev-dependencies]
anyhow = "1.0"
criterion = "0.4"
crossbeam = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "test-util", "macros"] }
futures = "0.3"

[features]
async = ["futures-core"]
std-mutex = []
# kanal's own spin mutex without the ~1 ms sleep in its backoff
nosleep-spin = []
# parking_lot::RawMutex as the channel mutex
parking-lot = ["dep:parking_lot"]
default = ["async"]

[[bench]]
name = "sync"
harness = false

[[bench]]
name = "async"
harness = false
