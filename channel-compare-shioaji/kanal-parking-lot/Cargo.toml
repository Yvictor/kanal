# Same kanal sources (../../src) built with feature `parking-lot` under another
# crate name, interleaved with the other lock variants in one binary.
[package]
name = "kanal-parking-lot"
version = "0.1.3"
edition = "2021"
publish = false

[lib]
name = "kanal_pl"
path = "../../src/lib.rs"

[dependencies]
cacheguard = "0.1"
futures-core = { version = "0.3", optional = true }
lock_api = "0.4"
parking_lot = { version = "0.12", optional = true }

[features]
async = ["futures-core"]
std-mutex = []
nosleep-spin = []
parking-lot = ["dep:parking_lot"]
default = ["async", "parking-lot"]
